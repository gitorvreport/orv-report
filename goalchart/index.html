<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Goal 간트차트</title>
<style>
  :root{
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --done:#0ca30c; --inprog:#2a78d6; --todo:#898781; --risk:#d03b3b;
    --weekend:rgba(137,135,129,.10); --today:#eb6834; --dep:#a9a8a2; --dep-block:#d03b3b;
    --chip:rgba(11,11,11,.05);
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --done:#0ca30c; --inprog:#3987e5; --todo:#6b6a66; --risk:#d03b3b;
    --weekend:rgba(137,135,129,.14); --today:#eb6834; --dep:#6b6a66; --dep-block:#e66767;
    --chip:rgba(255,255,255,.07);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:14px; line-height:1.5;
  }
  /* 본문은 읽기 좋은 폭을 유지하되, 간트 카드만 화면 폭을 쓴다.
     간트는 하루 46px 라 1180px 안에서는 좌측 라벨(320px)을 빼고 17일치밖에 못 그린다. */
  .wrap{max-width:1180px; margin:0 auto; padding:22px 20px 60px;}
  .wrap > .card{max-width:none; width:calc(100vw - 40px); margin-left:calc(50% - 50vw + 20px);}
  @media(max-width:1220px){ .wrap > .card{width:auto; margin-left:0;} }

  /* Header / toolbar */
  .top{display:flex; flex-wrap:wrap; gap:14px 18px; align-items:flex-end; justify-content:space-between; margin-bottom:16px;}
  .title-in{font-size:22px; font-weight:700; color:var(--ink); border:none; background:transparent; padding:2px 4px; border-radius:6px; width:min(440px,60vw);}
  .title-txt{font-size:22px; font-weight:700; color:var(--ink); padding:2px 4px;}
  .title-in:focus{outline:2px solid var(--inprog); background:var(--surface-1);}
  .dl-field{display:flex; align-items:center; gap:8px; color:var(--ink-2); font-size:13px;}
  .dl-field input{font:inherit; color:var(--ink); background:var(--surface-1); border:1px solid var(--border); border-radius:8px; padding:5px 8px;}
  .btns{display:flex; flex-wrap:wrap; gap:8px;}
  button{font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--surface-1); color:var(--ink); border-radius:9px; padding:7px 12px; transition:background .12s,border-color .12s;}
  button:hover{border-color:var(--axis);}
  button.primary{background:var(--inprog); color:#fff; border-color:transparent;}
  button.ghost{background:transparent;}

  /* Stats */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
  .stat{background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:14px 16px;}
  .stat .k{font-size:12px; color:var(--muted); letter-spacing:.02em;}
  .stat .v{font-size:26px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums;}
  .stat .s{font-size:12px; color:var(--ink-2); margin-top:2px;}
  .bar-mini{height:6px; border-radius:4px; background:var(--chip); margin-top:9px; overflow:hidden;}
  .bar-mini>i{display:block; height:100%; background:var(--inprog); border-radius:4px;}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr);}}

  /* Legend */
  .sync-note{min-height:16px; margin:8px 2px 0; font-size:12px; color:var(--muted);}
  .sync-note.bad{color:var(--risk);}
  .lookup-note{min-height:15px; font-size:12px; color:var(--muted); line-height:1.5;}
  .lookup-note.bad{color:var(--risk);}
  .lookup-note.ok{color:var(--done);}
  /* 값이 확정되기 전에는 아예 그리지 않는다. 저장된 값(배포 시점에 굳은 것)을
     잠깐 보여줬다 바꾸면, 흐리게 하더라도 값이 튀는 게 보인다. */
  .loading{padding:64px 20px; text-align:center; color:var(--muted); font-size:14px;}
  .loading .spin{display:inline-block; width:14px; height:14px; margin-right:8px;
    border:2px solid var(--grid); border-top-color:var(--inprog); border-radius:50%;
    vertical-align:-2px; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .loading .spin{animation:none;} }
  .legend{display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center; margin:2px 2px 14px; font-size:12.5px; color:var(--ink-2);}
  .lg{display:inline-flex; align-items:center; gap:7px;}
  .sw{width:16px; height:12px; border-radius:3px; display:inline-block;}
  .sw.done{background:var(--done);} .sw.inprog{background:var(--inprog);}
  .sw.todo{background:transparent; border:1.5px dashed var(--todo);} .sw.risk{background:var(--risk);}
  .lg svg{display:block;}

  /* Chart */
  .card{background:var(--surface-1); border:1px solid var(--border); border-radius:16px; overflow:hidden;}
  .chart-body{display:flex;}
  .labels{flex:0 0 auto; width:320px; border-right:1px solid var(--grid); min-width:0;}
  .resizer{flex:0 0 7px; cursor:col-resize; position:relative; touch-action:none;}
  .resizer::after{content:""; position:absolute; left:2px; top:0; bottom:0; width:3px; border-radius:2px; background:transparent;}
  .resizer:hover::after,.resizer.drag::after{background:var(--inprog);}
  .lhead{height:54px; display:flex; align-items:flex-end; padding:0 14px 8px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--grid);}
  .lrow{height:46px; display:flex; flex-direction:column; justify-content:center; padding:0 14px; border-bottom:1px solid var(--grid); cursor:pointer;}
  .lrow:hover{background:var(--chip);}
  .lrow .nm{font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px;}
  .lrow .meta{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sdot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
  .lock{color:var(--risk); font-size:11px;}
  .erow{height:34px; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--chip); border-bottom:1px solid var(--grid); font-weight:700; font-size:12.5px; color:var(--ink);}
  .erow .edot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .erow .enm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .erow .ekey{margin-left:auto; font-size:10.5px; font-weight:600; color:var(--muted); text-decoration:none; white-space:nowrap;}
  .erow .ekey:hover{color:var(--inprog);}
  .erow{cursor:pointer;}
  .erow .ecar{flex:0 0 auto; width:17px; height:17px; display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; line-height:1; color:var(--ink-2);
    border:1px solid var(--border); border-radius:4px; background:var(--page);}
  .erow:hover .ecar{color:var(--inprog); border-color:var(--inprog);}
  .erow .esum{flex:0 0 auto; font-size:10.5px; font-weight:500; color:var(--muted); white-space:nowrap;}
  .mv{display:none; flex:0 0 auto; gap:2px; margin-left:6px;}
  .lrow:hover .mv,.erow:hover .mv{display:flex;}
  .mvb{font:inherit; font-size:9px; line-height:1; padding:2px 4px; cursor:pointer;
       color:var(--ink-2); background:var(--surface-1); border:1px solid var(--border); border-radius:4px;}
  .mvb:hover{color:var(--inprog); border-color:var(--inprog);}
  .lrow{position:relative;}
  .lrow .mv{position:absolute; right:8px; top:50%; transform:translateY(-50%);}
  .jkey{color:var(--inprog); text-decoration:none; font-weight:600;}
  .jkey:hover{text-decoration:underline;}
  .eband{position:absolute; left:0; z-index:1; pointer-events:none;}
  /* 에픽 롤업 막대 — 하위 작업의 min(시작)~max(종료) */
  .ebar{position:absolute; height:11px; border-radius:3px; z-index:2; opacity:.92;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
  .ebar.clipL{border-top-left-radius:0; border-bottom-left-radius:0;}
  .ebar.clipR{border-top-right-radius:0; border-bottom-right-radius:0;}

  .tl-scroll{overflow-x:auto; flex:1 1 auto;}
  .timeline{position:relative;}
  .thead{position:relative; height:54px; border-bottom:1px solid var(--grid);}
  .wk{position:absolute; top:0; height:26px; display:flex; align-items:center; padding-left:10px; font-size:11.5px; font-weight:700; color:var(--ink-2); border-left:1px solid var(--grid); background:var(--chip);}
  .dcell{position:absolute; top:26px; height:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:var(--muted); border-left:1px solid var(--grid);}
  .dcell .dn{font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums;}
  .dcell.wknd{color:var(--risk);}
  .grid{position:relative;}
  .col{position:absolute; top:0; bottom:0; border-left:1px solid var(--grid);}
  .col.wknd{background:var(--weekend);}
  .todayline{position:absolute; top:0; bottom:0; width:2px; background:var(--today); z-index:6;}
  .todaytag{position:absolute; top:-2px; transform:translateX(-50%); background:var(--today); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:6px; white-space:nowrap; z-index:7;}
  .dlflag{position:absolute; top:-1px; transform:translateX(-50%); font-size:13px; z-index:7;}
  svg.arrows{position:absolute; top:0; left:0; pointer-events:none; z-index:4; overflow:visible;}
  .bar{position:absolute; height:26px; border-radius:7px; z-index:5; display:flex; align-items:center; gap:5px; padding:0 8px; font-size:11.5px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .bar:hover{filter:brightness(1.05); box-shadow:0 2px 7px rgba(0,0,0,.2);}
  .bar.done{background:var(--done);} .bar.inprog{background:var(--inprog);} .bar.risk{background:var(--risk);}
  /* 투명이면 뒤의 의존 화살표가 막대를 뚫고 비친다. 카드 배경으로 채워 가린다. */
  .bar.todo{background:var(--surface-1); border:1.5px dashed var(--todo); color:var(--ink-2); box-shadow:none;}
  .bar .ic{font-size:11px; flex:0 0 auto;}
  .bar.blocked{outline:2px solid var(--risk); outline-offset:1px;}
  .bar.clipL{border-top-left-radius:0; border-bottom-left-radius:0;}
  .bar.clipR{border-top-right-radius:0; border-bottom-right-radius:0;}
  .bnm{overflow:hidden; text-overflow:ellipsis;}
  /* 전체 표시 모드: 이름은 막대 안 제자리에서 시작해 오른쪽으로 넘친다.
     시작 위치가 곧 작업 시작일이라, 줄임 모드와 글자 위치가 어긋나지 않는다.
     막대를 벗어나면 배경이 밝아지므로 흰 글자로는 안 읽힌다 → 본문 색 + 밝은 후광.
     후광이 막대 위에서도 글자를 배경색에서 떼어내 준다. */
  .tl-full .bar{overflow:visible;}
  .tl-full .bnm{overflow:visible; text-overflow:clip; color:var(--ink);
    text-shadow:0 0 3px var(--surface-1), 0 0 3px var(--surface-1), 0 0 2px var(--surface-1);}
  .bar .clip{opacity:.9; font-weight:700; flex:0 0 auto;}
  .edgechip{position:absolute; z-index:5; width:14px; height:26px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#fff; cursor:pointer; opacity:.8; box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .edgechip.done{background:var(--done);} .edgechip.inprog{background:var(--inprog);} .edgechip.risk{background:var(--risk);}
  .edgechip.todo{background:var(--todo); color:var(--ink-2);}
  .milestone{position:absolute; z-index:5; width:20px; height:20px; transform:rotate(45deg); background:var(--risk); border:2px solid var(--surface-1); border-radius:4px; cursor:pointer;}

  /* Table view */
  .tblview{padding:6px 4px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--grid);}
  th{color:var(--muted); font-weight:600; font-size:12px;}
  td .sdot{display:inline-block; margin-right:6px; vertical-align:middle;}

  /* Drill-down: 통계 카드를 눌러 들어가는 상태별 목록 */
  .stat.tap{cursor:pointer; user-select:none; transition:border-color .12s, transform .12s;}
  .stat.tap:hover{border-color:var(--inprog); transform:translateY(-1px);}
  .stat.tap:focus-visible{outline:2px solid var(--inprog); outline-offset:2px;}
  .stat .more{margin-top:6px; font-size:11px; color:var(--inprog); font-weight:600;}
  .drill-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:4px 8px 14px;}
  .drill-head h2{margin:0; font-size:16px;}
  .drill-head .cnt{color:var(--muted); font-size:13px;}
  .drill-grp{margin:18px 0 6px; padding:0 8px; font-size:13px; font-weight:700;}
  .drill-grp:first-child{margin-top:0;}
  .drill-grp .n{color:var(--muted); font-weight:500; margin-left:6px;}
  td.why{color:var(--ink-2); line-height:1.5; overflow-wrap:anywhere; min-width:340px; max-width:560px;}
  /* 미완료 선행 한 줄 = 키 · 요약 · 그 선행의 상태. 그리드라 여러 줄에서도 세로로 맞는다. */
  .why .pv{display:grid; grid-template-columns:auto 1fr auto; gap:3px 12px; align-items:baseline; padding:2px 0;}
  .why .pk{color:var(--muted); font-size:11.5px; font-weight:600; text-decoration:none; white-space:nowrap;}
  .why .pk:hover{text-decoration:underline;}
  .why .pn{color:var(--ink); overflow-wrap:anywhere;}
  .why .pb{font-size:11.5px; font-weight:700; white-space:nowrap; text-align:right;}
  .why .pb.done{color:var(--done);} .why .pb.inprog{color:var(--inprog);}
  .why .pb.risk{color:var(--risk);} .why .pb.todo{color:var(--muted);}
  .drill-empty{padding:26px 10px; color:var(--muted);}

  /* Modal */
  .ov{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .ov.on{display:flex;}
  .modal{background:var(--surface-1); border:1px solid var(--border); border-radius:16px; width:min(560px,100%); max-height:90vh; overflow:auto; padding:20px;}
  .modal h3{margin:0 0 14px; font-size:16px;}
  .fld{margin-bottom:12px;}
  .fld label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .fld input,.fld select{width:100%; font:inherit; color:var(--ink); background:var(--page); border:1px solid var(--border); border-radius:9px; padding:8px 10px;}
  .row2{display:flex; gap:10px;} .row2>.fld{flex:1;}
  .drow{display:flex; gap:12px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .drow:last-child{border-bottom:none;}
  .dk{flex:0 0 84px; color:var(--muted);}
  .dv{flex:1; min-width:0; color:var(--ink); word-break:break-word;}
  /* 이름은 절대 자르지 않는다 — 이름 줄과 메타 줄을 분리해 이름이 폭을 다 쓰게 한다. */
  .dep-item{display:flex; align-items:flex-start; gap:7px; padding:5px 0; font-size:12.5px;}
  .dep-st{display:inline-flex; width:18px; height:18px; align-items:center; justify-content:center; border-radius:5px; font-size:11px; color:#fff; flex:0 0 auto; margin-top:1px;}
  .dep-st.done{background:var(--done);} .dep-st.inprog{background:var(--inprog);}
  .dep-st.todo{background:var(--todo);} .dep-st.risk{background:var(--risk);}
  .dep-body{flex:1 1 auto; min-width:0;}
  .dep-nm{color:var(--ink); line-height:1.4; overflow-wrap:anywhere;}
  .dep-meta{color:var(--muted); font-size:11.5px; margin-top:1px; overflow-wrap:anywhere;}
  .dep-jk{color:var(--inprog); text-decoration:none;}
  .dep-warn{color:var(--dep-block); font-size:12px; margin-bottom:4px;}
  .deps{max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:9px; padding:6px 8px;}
  .deps label{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink); margin:3px 0; cursor:pointer;}
  .deps input{width:auto;}
  .modal-actions{display:flex; justify-content:space-between; gap:8px; margin-top:16px;}

  /* Tips */
  details.tips{margin-top:18px; background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:4px 16px;}
  details.tips summary{cursor:pointer; font-weight:600; padding:12px 0; list-style:none;}
  details.tips summary::-webkit-details-marker{display:none;}
  details.tips[open] summary{border-bottom:1px solid var(--grid); margin-bottom:10px;}
  .tips ol{margin:0 0 12px; padding-left:20px;} .tips li{margin:5px 0;}
  .tips .h{font-weight:700; margin:12px 0 4px;}
  .foot{margin-top:14px; font-size:12px; color:var(--muted); text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div id="topLeft"></div>
    <div class="btns" id="topBtns"></div>
  </div>

  <div class="stats" id="stats"></div>
  
  <div class="sync-note" id="syncNote"></div>
  
  

  <div class="legend">
    <span class="lg"><span class="sw done"></span>완료</span>
    <span class="lg"><span class="sw inprog"></span>진행중</span>
    <span class="lg"><span class="sw todo"></span>예정</span>
    <span class="lg"><span class="sw risk"></span>기한 초과</span>
    <span class="lg"><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--dep)" stroke-width="2"/><path d="M26 5 l-6 -3 v6 z" fill="var(--dep)"/></svg>의존</span>
    <span class="lg"><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--dep-block)" stroke-width="2" stroke-dasharray="4 3"/><path d="M26 5 l-6 -3 v6 z" fill="var(--dep-block)"/></svg>선행 미완료 (대기)</span>
  </div>

  <div class="card">
    <div class="loading" id="loading"><span class="spin"></span>Jira에서 최신 일정을 불러오는 중…</div>
    <div class="chart-body" id="chartBody">
      <div class="labels" id="labels"></div>
      <div class="resizer" id="resizer" title="드래그해서 좌측 폭 조절"></div>
      <div class="tl-scroll"><div class="timeline" id="timeline"></div></div>
    </div>
    <div class="tblview" id="tblview" style="display:none"></div>
    <div class="tblview" id="drillview" style="display:none"></div>
  </div>

  

  
  
  <div class="foot">읽기 전용 보기입니다. 내용 수정은 관리자에게 요청하세요.</div>
  
</div>



<!-- Detail panel (읽기 전용) -->
<div class="ov" id="ovD">
  <div class="modal">
    <h3 id="dTitle">작업</h3>
    <div id="dBody"></div>
    <div class="modal-actions" style="justify-content:flex-end">
      <button class="ghost" onclick="closeDetail()">닫기</button>
    </div>
  </div>
</div>

<script>
/* ---------- data model ---------- */
const DAY_W = 46, ROW_H = 46, HEAD_H = 54, BAR_H = 26, EPIC_H = 34;
const EPIC_COLORS = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];
function hexA(h,a){const n=parseInt(h.slice(1),16); return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
const STLABEL = {done:"완료", inprog:"진행중", todo:"예정", risk:"기한 초과"};
const STICON  = {done:"✓", inprog:"◐", todo:"○", risk:"▲"};
const STVAR   = {done:"var(--done)", inprog:"var(--inprog)", todo:"var(--todo)", risk:"var(--risk)"};

const MODE = "view";
const IS_EDIT = MODE === "edit";
let state = {
  "title": "B1 마감 — Weekly Goal (ORVV-7762)",
  "deadline": "2026-08-31",

let nextId = 153;
function jiraUrl(key){return key ? (state.jiraBase + encodeURIComponent(key)) : null;}

/* ---------- date helpers ---------- */
function pd(s){const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d);}
function iso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function addD(dt,n){const r=new Date(dt); r.setDate(r.getDate()+n); return r;}
function diffD(a,b){return Math.round((b-a)/86400000);}
function mondayOf(dt){const wd=(dt.getDay()+6)%7; return addD(dt,-wd);}
function todayMid(){const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
const WD = ["일","월","화","수","목","금","토"];

function frame(){
  if(state.window && state.window.on && state.window.start && state.window.end){
    const start=pd(state.window.start), end=pd(state.window.end);
    return {start, end, days:Math.max(diffD(start,end)+1,1), windowed:true};
  }
  const ds=[...state.tasks.map(t=>pd(t.start)), ...state.tasks.map(t=>pd(t.end)), pd(state.deadline)];
  let mn=ds[0], mx=ds[0];
  ds.forEach(d=>{if(d<mn)mn=d; if(d>mx)mx=d;});
  const start=mondayOf(mn);
  let end=addD(mondayOf(mx),6);            // to Sunday of last week
  const days=diffD(start,end)+1;
  return {start,end,days,windowed:false};
}
function outOfWindow(f,t){
  const s=diffD(f.start,pd(t.start)), e=diffD(f.start,pd(t.end));
  return e<0 ? "before" : (s>f.days-1 ? "after" : null);
}

/* ---------- rendering ---------- */
// 표시 순서는 state.tasks 의 배열 위치 그 자체다. 별도 order 필드를 두지 않는다 —
// 새 작업은 push 로 맨 뒤에 붙고, 내보내기/불러오기가 순서를 그대로 왕복시킨다.
function ordered(){return [...state.tasks];}

function isBlocked(t){
  if(t.status==="done") return false;
  return (t.deps||[]).some(id=>{const p=state.tasks.find(x=>x.id===id); return p && p.status!=="done";});
}

function epicKeyOf(t){
  return (t && t.epic && t.epic.key) || "__none__";
}

/* group selected issues by their parent epic; only chosen issues appear */
// 에픽 순서 = 배열에서 처음 등장한 순서(Map 의 삽입 순서). 별도 정렬하지 않는다.
function groups(){
  const rows=ordered(), map=new Map();
  rows.forEach(t=>{
    const key = epicKeyOf(t);
    if(!map.has(key)) map.set(key,{gkey:key, key:(t.epic&&t.epic.key)||null, name:(t.epic&&t.epic.name)||"미분류", tasks:[]});
    map.get(key).tasks.push(t);
  });
  const arr=[...map.values()];
  arr.forEach((g,i)=>g.color=EPIC_COLORS[i%EPIC_COLORS.length]);
  return arr;
}

// 에픽의 기간 = 하위 작업의 min(시작) ~ max(종료). 날짜 문자열이 ISO(YYYY-MM-DD)라
// 사전순 비교가 곧 시간순 비교다 — Date 로 바꿀 필요가 없다.
function epicSpan(tasks){
  let s=null, e=null;
  tasks.forEach(function(t){
    if(!t || !t.start || !t.end) return;
    if(s===null || t.start < s) s = t.start;
    if(e===null || t.end   > e) e = t.end;
  });
  return (s===null || e===null) ? null : { start:s, end:e };
}

function epicSummary(g){
  const n=g.tasks.length;
  const d=g.tasks.filter(t=>t.status==="done").length;
  const b=g.tasks.filter(t=>isBlocked(t)).length;
  return "작업 "+n+" · 완료 "+d+(b?" · 대기 "+b:"");
}

const UI_KEY = "goalchart.ui";
const LABEL_W_MIN = 160, LABEL_W_MAX = 560, LABEL_W_DEFAULT = 320;
function clampLabelW(w){ return Math.max(LABEL_W_MIN, Math.min(LABEL_W_MAX, Math.round(w)||LABEL_W_DEFAULT)); }
function loadUI(){
  try{
    const raw = localStorage.getItem(UI_KEY);
    const o = raw ? JSON.parse(raw) : {};
    return { labelW: clampLabelW(o.labelW || LABEL_W_DEFAULT),
             expanded: Array.isArray(o.expanded) ? o.expanded.slice() : [],
             // 기본은 "full". 이름이 잘려 보이면 차트를 읽을 수 없어서다 —
             // 명시적으로 "clip" 을 저장한 사람만 잘라 보여준다.
             barText: o.barText === "clip" ? "clip" : "full" };
  }catch(e){ return { labelW: LABEL_W_DEFAULT, expanded: [], barText: "full" }; }
}
let ui = loadUI();
function saveUI(){ try{ localStorage.setItem(UI_KEY, JSON.stringify(ui)); }catch(e){} }

// 막대 글자: "clip" = 막대 안에서 말줄임, "full" = 막대 밖 오른쪽에 전체 표시
function barTextIsFull(){ return ui.barText === "full"; }
function toggleBarText(){ ui.barText = barTextIsFull() ? "clip" : "full"; saveUI(); render(); }

// 기본은 접힘. "접힌 목록"이 아니라 "펼친 목록"을 저장하는 이유는, 나중에 데이터에
// 에픽이 추가돼도 목록에 없으니 자동으로 접힌 채로 나오기 때문이다.
function isCollapsed(gkey){ return ui.expanded.indexOf(gkey) === -1; }
function toggleEpicAt(i){
  const g = groups()[i]; if(!g) return;
  const at = ui.expanded.indexOf(g.gkey);
  if(at === -1) ui.expanded.push(g.gkey); else ui.expanded.splice(at,1);
  saveUI(); render();
}
// 에픽이 하나도 없으면 "전부 펼쳐짐"으로 보지 않는다 — 빈 차트에서 버튼이
// "전체 접기"로 뜨면 누를 게 없는데 접겠다고 말하는 꼴이 된다.
function allEpicsExpanded(){
  const gs = groups();
  return gs.length > 0 && gs.every(function(g){ return !isCollapsed(g.gkey); });
}

  ui.expanded = allEpicsExpanded() ? [] : groups().map(function(g){ return g.gkey; });

}



function applyLabelWidth(){ document.getElementById("labels").style.width = ui.labelW + "px"; }
function initResizer(){
  const rz = document.getElementById("resizer"), lb = document.getElementById("labels");
  let startX = 0, startW = 0, dragging = false;
  rz.addEventListener("pointerdown", e=>{
    dragging = true; startX = e.clientX; startW = lb.offsetWidth;
    rz.classList.add("drag"); rz.setPointerCapture(e.pointerId); e.preventDefault();
  });
  rz.addEventListener("pointermove", e=>{
    if(!dragging) return;
    ui.labelW = clampLabelW(startW + (e.clientX - startX));
    applyLabelWidth();
  });
  const end = ()=>{ if(!dragging) return; dragging = false; rz.classList.remove("drag"); saveUI(); };
  rz.addEventListener("pointerup", end);
  rz.addEventListener("pointercancel", end);
}

// 접힌 에픽의 작업은 taskY 에 들어가지 않는다 → 막대·화살표 루프의 기존 가드가

function layoutRows(gs){

}

// 배경 격자 · 에픽 스윔레인 밴드와 롤업 막대 · 오늘 선 · 마감 깃발.
function gridBackgroundHtml(f, lay, W, H){

  }

    const sp=epicSpan(it.g.tasks);
    if(sp){
      const sIdx=diffD(f.start,pd(sp.start)), eIdx=diffD(f.start,pd(sp.end));
      if(!(eIdx<0 || sIdx>f.days-1)){
        const cs=Math.max(sIdx,0), ce=Math.min(eIdx,f.days-1);
        const clipL=sIdx<0, clipR=eIdx>f.days-1;

              (it.y+(EPIC_H-11)/2)+'px; width:'+width+'px; background:'+it.g.color+'" title="'+
              esc(it.g.name)+' · '+mmdd(sp.start)+'~'+mmdd(sp.end)+' · '+esc(epicSummary(it.g))+'"></div>';
      }
    }
  }});
  // today
  const ti=diffD(f.start,todayMid());
  if(ti>=0 && ti<f.days){

    }
    const cs=Math.max(sIdx,0), ce=Math.min(eIdx,f.days-1);
    const clipL=sIdx<0, clipR=eIdx>f.days-1;
    if(t.milestone && !clipL && !clipR){
      const x=(eIdx+1)*DAY_W-DAY_W/2-10;
      grid+='<div class="milestone'+(blk?' blocked':'')+'" style="left:'+x+'px; top:'+(cy-10)+'px" title="'+esc(t.name)+'" onclick="openEdit('+t.id+')"></div>';
      return;
    }
    const left=cs*DAY_W+4, width=Math.max((ce-cs+1)*DAY_W-8,22);
    const tip='title="'+esc(t.name)+' ('+STLABEL[t.status]+') '+mmdd(t.start)+'~'+mmdd(t.end)+'"';
    const cls='bar '+t.status+(blk?' blocked':'')+(clipL?' clipL':'')+(clipR?' clipR':'');
    const inner=(clipL?'<span class="clip">‹</span>':'')+'<span class="ic">'+STICON[t.status]+'</span>';
    const tail=(clipR?'<span class="clip">›</span>':'');
    // 마크업은 두 모드가 같다. 넘칠지 자를지는 .tl-full 이 CSS 로 정한다 —
    // 그래야 글자 시작 위치가 모드와 무관하게 막대 안 제자리로 고정된다.
    grid+='<div class="'+cls+'" style="left:'+left+'px; top:'+top+'px; width:'+width+'px" onclick="openEdit('+t.id+')" '+tip+'>'+
          inner+'<span class="bnm">'+esc(t.name)+'</span>'+tail+'</div>';
  });
  return grid;
}

// 조립만 한다. 각 조각이 문자열을 만들고 여기서 두 번의 innerHTML 로 끝난다 —
// 조각을 늘리더라도 DOM 쓰기는 이 두 곳으로 유지할 것(중간 리플로우를 만들지 않는다).
function render(){
  const f=frame();
  syncTop();

  const gs=groups();
  const {lay, taskY, H}=layoutRows(gs);

  document.getElementById("labels").innerHTML = labelsHtml(lay, gs, f);

  const tl=document.getElementById("timeline");

  tl.style.width=W+"px";

  tl.innerHTML = timelineHeadHtml(f, W)
               + gridBackgroundHtml(f, lay, W, H)
               + arrowsHtml(f, taskY, W, H)
               + barsHtml(f, taskY)
               + '</div>';

  renderStats(f);

function renderStats(f){
  const T=state.tasks, n=T.length;
  const done=T.filter(t=>t.status==="done").length;
  // 완료 건수만으로 센다. 손으로 적는 진척률은 관리 비용만 들고 믿을 수 없어 걷어냈다.
  const prog=Math.round(done*100/Math.max(n,1));
  const dday=diffD(todayMid(),pd(state.deadline));
  // 카드 숫자는 목록과 같은 기준이어야 한다 — 눌러서 들어갔을 때 건수가 달라지면 안 된다.
  const blocked=T.filter(isWaiting).length;
  const risk=T.filter(t=>t.status==="risk").length;
  const ddText = dday>0?("D-"+dday):(dday===0?"D-Day":("D+"+(-dday)));
  document.getElementById("stats").innerHTML =
    stat("마감까지", ddText, "마감 "+mmdd(state.deadline)) +
    stat("전체 진척률", prog+"%", done+" / "+n+" 완료", prog) +
    stat("진행중", T.filter(t=>t.status==="inprog").length+"건", "예정 "+T.filter(t=>t.status==="todo").length+"건", undefined, "active") +
    stat("대기·기한 초과", (blocked+risk)+"건", "⏳ 대기 "+blocked+" · ⚠ 기한 초과 "+risk, undefined, "attention");
}
// kind 를 주면 눌러서 목록으로 들어가는 카드가 된다. onclick 은 인자 조립 없이
// 리터럴 하나만 넣는다 — 문자열을 이어 붙이다 문법이 깨지면 핸들러가 통째로 죽는다.
function stat(k,v,s,pct,kind){
  const mini = (pct!==undefined) ? '<div class="bar-mini"><i style="width:'+pct+'%"></i></div>' : '';
  if(!kind) return '<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div>'+mini+'</div>';
  return '<div class="stat tap" role="button" tabindex="0" onclick="openDrill(\''+kind+'\')"'+
         ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openDrill(\''+kind+'\');}">'+
         '<div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div>'+mini+
         '<div class="more">목록 보기 →</div></div>';
}

/* ---------- 데이터가 얼마나 낡았나 (편집본 전용) ---------- */


/* ---------- Jira 최신값 적용 (양쪽 공통) ---------- */
// 뷰어는 열 때 자동으로, 편집본은 버튼으로 부른다. **마커 밖에 둬야 한다** —
// 한쪽 마커 안에 넣으면 다른 쪽에서 ReferenceError 가 나고, 인라인 핸들러라 예외도 안 보인다.
// Jira 가 갖지 않는 것(의존관계·표시 순서·표시 창·마감)은 건드리지 않는다.
function applyJiraIssues(tasks, issues, today){
  const by={}; issues.forEach(function(x){ by[x.key]=x; });
  let n=0;
  tasks.forEach(function(t){
    const j=by[t.jira]; if(!j) return;
    n++;
    if(j.name) t.name=j.name;
    let start=j.start, end=j.end, miss="";
    // 날짜가 비면 오늘에 붙이고 사유를 담당자 칸에 덧붙인다 (data 생성 규칙과 같다).
    if(!start && !end){ start=end=today; miss="일정 미정"; }
    else if(!start){ start=end; miss="시작일 미정"; }
    else if(!end){ end=start; miss="마감 미정"; }
    if(end<start){ const x=start; start=end; end=x; }
    t.start=start; t.end=end;
    t.owner=[(j.owner||""), miss].filter(Boolean).join(" · ");
    // 기한 초과 판정은 '지금' 기준으로 다시 한다 — 인라인 값은 빌드 시점에 굳은 것이다.
    t.status=(j.status!=="done" && t.end<today) ? "risk" : j.status;
    if(j.epicKey)  t.epic.key=j.epicKey;
    if(j.epicName) t.epic.name=j.epicName;
  });
  return n;
}

// 값이 확정되기 전에는 차트를 그리지 않고 로딩 자리만 보여준다. 양쪽이 함께 쓴다 —
// 뷰어는 열 때 자동 갱신에서, 편집본은 배포본으로 열렸을 때.
function setLoading(on){
  const ld=document.getElementById("loading");
  if(ld) ld.style.display = on ? "block" : "none";
  const body=document.getElementById("chartBody");
  if(body && on) body.style.display="none";   // 끌 때는 syncPanes 가 제 상태로 되돌린다
}

/* ---------- 열 때마다 자동 갱신 (뷰어 전용) ---------- */

// 페이지를 열 때마다 중계 Worker 에서 최신값을 받아 덮어쓴다.
// 실패하면 저장된 데이터 그대로 보여준다 — 차트가 안 뜨는 것보다 조금 낡은 게 낫다.
function showSyncNote(text, bad){
  const el=document.getElementById("syncNote");
  if(!el) return;
  el.textContent=text;
  el.className="sync-note"+(bad?" bad":"");
}

const SYNC_TIMEOUT = 8000;   // Worker 가 느려도 로딩 화면에 갇히지 않게 한다

// 뷰어의 첫 그리기는 여기서만 일어난다. 성공이든 실패든 **한 번만** 그리므로
// 인라인 값이 잠깐 보였다 바뀌는 일이 없다.
async function syncFromJira(){
  const url=state.syncEndpoint;
  if(!url){ setLoading(false); render(); syncPanes(); showSyncNote(""); return; }
  setLoading(true);
  showSyncNote("Jira 최신값 확인 중…");
  // AbortSignal.timeout 이 없는 브라우저도 있어 컨트롤러를 직접 쓴다.
  const ac=(typeof AbortController!=="undefined") ? new AbortController() : null;
  const timer=ac ? setTimeout(function(){ ac.abort(); }, SYNC_TIMEOUT) : null;
  try{
    const res=await fetch(url, ac ? {cache:"no-store", signal:ac.signal} : {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const body=await res.json();
    if(!body || !Array.isArray(body.issues)) throw new Error("응답 형식이 다릅니다");
    const n=applyJiraIssues(state.tasks, body.issues, iso(todayMid()));
    const t=new Date();
    showSyncNote("Jira 최신 · "+t.getHours()+":"+String(t.getMinutes()).padStart(2,"0")+" 기준 "+n+"건 반영");
  }catch(e){
    const why=(e && e.name==="AbortError") ? "응답이 너무 늦습니다" : (e.message||e);
    showSyncNote("Jira 갱신 실패 — 저장된 데이터를 표시합니다 ("+why+")", true);
  }finally{
    if(timer) clearTimeout(timer);
    // 실패해도 반드시 그린다. 안 그리면 로딩 화면에 갇힌다.
    setLoading(false);
    render();
    syncPanes();
  }
}


/* ---------- 상태 드릴다운 ---------- */
// 통계 카드 → 해당 상태의 작업 목록. 각 뷰는 그룹 두 개로 나뉘고,
// 그룹 안의 순서는 state.tasks 배열 순서 그대로다(차트와 같은 순서로 읽히도록).
const DRILL = {
  active: {
    title: "진행중 · 예정",
    groups: [
      {label:"진행중", pick:t=>t.status==="inprog"},
      {label:"예정",   pick:t=>t.status==="todo"},
    ],
  },
  attention: {
    title: "대기 · 기한 초과",
    groups: [
      {label:"대기",     pick:t=>isWaiting(t),     col:"선행 작업", cell:prevListHtml},
      {label:"기한 초과", pick:t=>t.status==="risk", col:"사유",      cell:t=>esc(riskReason(t))},
    ],
  },
};
let drillKind=null;

// 착수 준비 기간. 시작일이 아직 이만큼 남았으면 선행이 안 끝난 게 정상이라 목록에 넣지 않는다.
const LEAD_DAYS = 3;

// 대기: 선행이 미완료이고, 착수 준비 시점(시작일 -3일)을 이미 지난 것만.
// 차트의 ⏳ 와 점선 화살표는 isBlocked 를 그대로 쓴다 — 그쪽은 의존관계라는 사실 자체를
// 그리는 것이고, 이 목록은 '지금 주목할 것'만 걸러내는 자리다.
function isWaiting(t){
  if(!isBlocked(t)) return false;
  return diffD(addD(pd(t.start), -LEAD_DAYS), todayMid()) >= 0;
}

// 미완료 선행을 한 줄씩. 키·요약·그 선행 자신의 상태를 나란히 둔다.
function prevListHtml(t){
  const pend=(t.deps||[])
    .map(id=>state.tasks.find(x=>x.id===id))
    .filter(p=>p && p.status!=="done");
  if(!pend.length) return '<span style="color:var(--muted)">—</span>';
  return pend.map(function(p){
    const key=p.jira
      ? '<a class="pk" href="'+jiraUrl(p.jira)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(p.jira)+'</a>'
      : '<span class="pk">키 없음</span>';
    return '<div class="pv">'+key+'<span class="pn">'+esc(p.name)+'</span>'+
           '<span class="pb '+p.status+'">'+STLABEL[p.status]+'</span></div>';
  }).join("");
}
function riskReason(t){
  const over=diffD(pd(t.end), todayMid());
  return "마감 "+mmdd(t.end)+"이 지났으나 완료되지 않음"+(over>0?" ("+over+"일 경과)":"");
}

function openDrill(kind){
  if(!DRILL[kind]) return;
  const wasOpen = !!drillKind;
  drillKind=kind;
  // 차트 → 목록은 히스토리에 한 칸 쌓고, 목록 → 다른 목록은 그 칸을 갈아끼운다.
  // 목록 사이를 오간 흔적이 쌓이지 않으므로 뒤로가기도 '차트로 돌아가기'도 언제나 차트로 간다.
  try{
    if(wasOpen) history.replaceState({drill:kind}, "");
    else history.pushState({drill:kind}, "");
  }catch(e){}
  syncPanes(); renderDrill();
}
function closeDrill(){
  // 화면의 '차트로 돌아가기'도 뒤로가기와 같은 경로를 타게 한다 — 상태가 두 벌로 갈리지 않는다.
  // 쌓인 칸이 언제나 하나뿐이라 back() 한 번이면 차트다.
  if(history.state && history.state.drill){ history.back(); return; }
  drillKind=null; syncPanes();
}
window.addEventListener("popstate", function(ev){
  drillKind=(ev.state && ev.state.drill) || null;
  syncPanes();
  if(drillKind) renderDrill();
});

// 어느 화면을 보일지는 여기 한 곳에서만 정한다.
function syncPanes(){
  const d=!!drillKind;
  document.getElementById("chartBody").style.display=(d||tableOn)?"none":"flex";
  document.getElementById("tblview").style.display=(!d&&tableOn)?"block":"none";
  document.getElementById("drillview").style.display=d?"block":"none";
  const lg=document.querySelector(".legend");
  if(lg) lg.style.display=d?"none":"";
}

function renderDrill(){
  const conf=DRILL[drillKind]; if(!conf) return;
  const all=ordered();
  const picked=conf.groups.map(g=>({g:g, rows:all.filter(g.pick)}));
  const total=picked.reduce((a,x)=>a+x.rows.length,0);
  let h='<div class="drill-head">'+
        '<button class="ghost" onclick="closeDrill()">← 차트로 돌아가기</button>'+
        '<h2>'+esc(conf.title)+'</h2><span class="cnt">'+total+'건</span></div>';
  if(!total) h+='<div class="drill-empty">해당하는 작업이 없습니다.</div>';
  picked.forEach(function(x){
    if(!x.rows.length) return;
    h+='<div class="drill-grp">'+esc(x.g.label)+'<span class="n">'+x.rows.length+'건</span></div>';
    h+='<table><thead><tr><th>에픽</th><th>Jira</th><th>작업</th><th>담당</th><th>기간</th>'+
       (x.g.cell?'<th>'+esc(x.g.col)+'</th>':'<th>상태</th>')+'</tr></thead><tbody>';
    x.rows.forEach(function(t){
      const ep=t.epic?esc(t.epic.name):'<span style="color:var(--muted)">미분류</span>';
      const jk=t.jira?'<a class="jkey" href="'+jiraUrl(t.jira)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(t.jira)+'</a>':'—';
      const tail = x.g.cell
        ? '<td class="why">'+x.g.cell(t)+'</td>'
        : '<td>'+STLABEL[t.status]+'</td>';
      h+='<tr onclick="openEdit('+t.id+')" style="cursor:pointer">'+
         '<td>'+ep+'</td><td>'+jk+'</td>'+
         '<td><span class="sdot" style="background:'+STVAR[t.status]+'"></span>'+esc(t.name)+'</td>'+
         '<td>'+esc(t.owner||'')+'</td><td>'+mmdd(t.start)+'~'+mmdd(t.end)+'</td>'+tail+'</tr>';
    });
    h+='</tbody></table>';
  });
  document.getElementById("drillview").innerHTML=h;
}

function renderTable(){
  const rows=ordered();
  let h='<table><thead><tr><th>에픽</th><th>Jira</th><th>작업</th><th>담당</th><th>기간</th><th>상태</th><th>선행</th></tr></thead><tbody>';
  rows.forEach(t=>{
    const deps=(t.deps||[]).map(id=>{const p=state.tasks.find(x=>x.id===id);return p?(p.jira||p.name):"";}).filter(Boolean).join(", ");
    const blk=isBlocked(t)?' ⏳':'';
    const ep=t.epic?esc(t.epic.name):'<span style="color:var(--muted)">미분류</span>';
    const jk=t.jira?'<a class="jkey" href="'+jiraUrl(t.jira)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(t.jira)+'</a>':'—';
    h+='<tr onclick="openEdit('+t.id+')" style="cursor:pointer">'+
       '<td>'+ep+'</td><td>'+jk+'</td>'+
       '<td><span class="sdot" style="background:'+STVAR[t.status]+'"></span>'+esc(t.name)+blk+'</td>'+
       '<td>'+esc(t.owner||'')+'</td><td>'+mmdd(t.start)+'~'+mmdd(t.end)+'</td>'+
       '<td>'+STLABEL[t.status]+'</td>'+
       '<td style="color:var(--muted)">'+esc(deps||'—')+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById("tblview").innerHTML=h;
}

/* ---------- utils ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function mmdd(s){const d=pd(s); return (d.getMonth()+1)+"/"+d.getDate();}

// 편집 중인 작업 id. **마커 밖에 둔다** — 뷰어의 closeEdit 도 이 변수를 건드리므로
// EDIT-ONLY 안에 넣으면 뷰어에서 선언만 사라지고 참조가 남아 ReferenceError 가 난다.
// 그리고 lookupIssue 보다 앞이어야 한다(뒤면 TDZ).
let editingId=null;

/* ---------- Jira 이슈 불러오기 (편집본 전용) ---------- */


/* ---------- edit modal ---------- */


function openEdit(id){
  if(!IS_EDIT) return openDetail(id);
  
}
function closeEdit(){const o=document.getElementById("ov"); if(o) o.classList.remove("on"); editingId=null;}

/* ---------- detail panel (읽기 전용) ---------- */
function openDetail(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const jk=t.jira?'<a href="'+jiraUrl(t.jira)+'" target="_blank" rel="noopener" style="color:var(--inprog)">'+esc(t.jira)+' ↗</a>':"—";
  const ep=t.epic?esc([t.epic.key,t.epic.name].filter(Boolean).join(" · ")):"—";
  const rows=[
    ["Jira 이슈", jk],
    ["에픽", ep],
    ["담당", esc(t.owner||"—")],
    ["상태", '<span class="dep-st '+t.status+'">'+STICON[t.status]+'</span> '+STLABEL[t.status]],
    ["기간", mmdd(t.start)+" ~ "+mmdd(t.end)],
    ["선행 작업", depDetailHtml(t)],
    ["후행 작업", succDetailHtml(t)],

  document.getElementById("dTitle").textContent=t.name;
  document.getElementById("dBody").innerHTML=rows.map(r=>
    '<div class="drow"><span class="dk">'+r[0]+'</span><span class="dv">'+r[1]+'</span></div>').join("");

// 뷰어의 '선행 작업'은 지정된 선행만 보여주되, 각각의 현재 상태를 함께 읽게 한다.
// 선행·후행 한 항목의 공통 렌더. 이름은 자기 줄을 통째로 쓰고(자르지 않는다),
// Jira 키와 부가정보는 아래 메타 줄로 내린다 — 좌측 라벨 행과 같은 패턴이다.
function depItemHtml(x, metaTail){
  const jk = x.jira
    ? '<a class="dep-jk" href="'+jiraUrl(x.jira)+'" target="_blank" rel="noopener">'+esc(x.jira)+'</a> · '
    : "";
  return '<div class="dep-item">'+
    '<span class="dep-st '+x.status+'">'+STICON[x.status]+'</span>'+
    '<div class="dep-body">'+
      '<div class="dep-nm">'+esc(x.name)+'</div>'+
      '<div class="dep-meta">'+jk+metaTail+'</div>'+
    '</div>'+
  '</div>';
}
function depDetailHtml(t){
  const deps=(t.deps||[]).map(d=>state.tasks.find(x=>x.id===d)).filter(Boolean);
  if(!deps.length) return '<span style="color:var(--muted)">없음</span>';
  const head=isBlocked(t)?'<div class="dep-warn">선행 작업이 완료되지 않아 대기 상태입니다</div>':"";
  return head+deps.map(function(p){
    return depItemHtml(p, STLABEL[p.status]);
  }).join("");
}
// 후행 작업 = 이 작업을 선행으로 지정한 작업들. deps 는 후행 쪽에만 기록되므로
// 역방향은 전체를 훑어야 알 수 있다.
function successorsOf(tasks, id){
  return tasks.filter(x => (x.deps||[]).indexOf(id) !== -1);
}
function succDetailHtml(t){
  const succ=successorsOf(state.tasks, t.id);
  if(!succ.length) return '<span style="color:var(--muted)">없음</span>';
  return succ.map(function(s){
    return depItemHtml(s, mmdd(s.start)+" 시작"+(s.owner?" · "+esc(s.owner):""));
  }).join("");
}
function closeDetail(){document.getElementById("ovD").classList.remove("on");}
document.getElementById("ovD").addEventListener("click",e=>{if(e.target.id==="ovD")closeDetail();});




/* ---------- toolbar actions ---------- */


const TOP_LEFT_VIEW =
  '<div class="title-txt" id="titleTxt"></div>' +
  '<div class="dl-field" style="margin-top:6px;"><span>🎯 마감일</span><b id="deadlineTxt"></b></div>' +
  '<div class="dl-field" style="margin-top:6px;"><span id="winTxt"></span></div>';
const TOP_BTNS_VIEW =
  '<button class="ghost" id="viewBtn" onclick="toggleView()">표로 보기</button>' +
  '<button class="ghost" id="allBtn" onclick="toggleAllEpics()">전체 펼치기</button>' +
  '<button class="ghost" id="txtBtn" onclick="toggleBarText()">글자 전체</button>' +
  '<button class="ghost" onclick="toggleTheme()" id="thBtn">🌙 다크</button>';

// 부팅 때 한 번만. 편집본은 입력에 포커스가 살아 있어야 하므로 재빌드하지 않는다.
function buildTop(){
  // TOP_*_EDIT 는 EDIT-ONLY 구간에서 선언되므로 뷰어 산출물에는 아예 없다.
  // 삼항 연산자로 참조하면 문법·파싱은 통과하지만(미평가 분기) 심볼이 뷰어에 남아
  // 조건 한 줄만 바뀌어도 ReferenceError 로 백지가 된다. 참조 자체를 마커 안에 둔다.
  let left = TOP_LEFT_VIEW, btns = TOP_BTNS_VIEW;
  
  document.getElementById("topLeft").innerHTML = left;
  document.getElementById("topBtns").innerHTML = btns;
  
}

// render() 가 매번 부른다.
function syncTop(){
  // 모드와 무관한 공통 토글 라벨부터. (아래 편집 분기는 return 하므로 여기가 먼저다)
  const tb = document.getElementById("txtBtn");
  if(tb) tb.textContent = barTextIsFull() ? "글자 줄임" : "글자 전체";
  const ab = document.getElementById("allBtn");
  if(ab) ab.textContent = allEpicsExpanded() ? "전체 접기" : "전체 펼치기";
  
  document.getElementById("titleTxt").textContent = state.title;
  document.getElementById("deadlineTxt").textContent = state.deadline;
  const w = state.window;
  document.getElementById("winTxt").textContent =
    (w && w.on) ? ("📅 표시 범위 " + w.start + " ~ " + w.end) : "📅 표시 범위 자동";
}

let tableOn=false;
function toggleView(){
  tableOn=!tableOn;
  syncPanes();
  document.getElementById("viewBtn").textContent=tableOn?"간트로 보기":"표로 보기";
}
function toggleTheme(){
  const h=document.documentElement;
  const dark=h.getAttribute("data-theme")==="dark";
  h.setAttribute("data-theme",dark?"light":"dark");
  document.getElementById("thBtn").textContent=dark?"🌙 다크":"☀️ 라이트";
}




buildTop();
applyLabelWidth();
initResizer();

// 뷰어는 render() 를 여기서 부르지 않는다 — syncFromJira 가 값이 확정된 뒤 한 번만 그린다.
syncFromJira();


</script>
