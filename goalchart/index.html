<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milestone Gantt Chart</title>
<link rel="stylesheet" href="./_app/app.css">
<style>
  .charts{max-width:720px;margin:48px auto;padding:0 16px}
  .charts h1{font-size:20px;margin:0 0 20px}
  .chart-item{display:block;padding:16px 18px;margin-bottom:10px;border:1px solid var(--border);
    border-radius:10px;background:var(--surface-1);text-decoration:none;color:var(--ink)}
  .chart-item:hover{border-color:var(--axis)}
  .chart-item.invalid{opacity:.6;cursor:default;background:var(--page)}
  .chart-item .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .empty{color:var(--muted);padding:24px 0}
</style>
</head>
<body>
<div class="charts">
  <h1>Milestone Gantt Chart</h1>
  <div id="list" class="empty">불러오는 중…</div>
</div>
<script>
// 목록은 charts.json 에서 온다 — GAS 가 차트를 배포할 때 자기 항목을 갱신한다.
// 여기에 차트 id 를 박으면 새 차트를 만들 때마다 코드를 배포해야 한다.

// 차트 id 가 유효한 범위인지 검증한다. 경로 탈출(/상대경로) 방지.
function isValidChartId(id) {
  return /^[a-z0-9-]{1,32}$/.test(id);
}

// charts.json 의 형식과 내용을 판단한다. 호출부에서 렌더링 분기를 결정한다.
// 각 항목의 유효성을 판단하고 valid 플래그를 붙인다. 무효한 항목도 버리지 않는다.
function listState(charts) {
  if (!Array.isArray(charts)) {
    return {kind: "malformed", message: "charts.json 형식이 올바르지 않습니다."};
  }
  if (!charts.length) {
    return {kind: "empty", message: "아직 등록된 차트가 없습니다."};
  }
  return {kind: "ok", items: charts.map(function(c) {
    // c 자체가 null/undefined 이거나 객체가 아닐 수 있다(charts.json 은 GAS 가 쓰는
    // 파일이라 실제로 발생한다). c.id 를 바로 읽으면 TypeError 로 루프가 죽고 화면이
    // "불러오는 중…"에 멈춘다 — 이 페이지의 원칙(버리지 말고 보이게)대로, 그런 항목도
    // 버리지 않고 무효 항목으로 보이게 한다.
    var chart = (c && typeof c === "object") ? c : {};
    return {chart: chart, valid: !!c && isValidChartId(chart.id)};
  })};
}

(async function(){
  var el = document.getElementById("list");
  var charts;
  try{
    var res = await fetch("./charts.json", {cache:"no-cache"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    charts = await res.json();
  }catch(e){
    el.textContent = "목록을 불러오지 못했습니다 (" + (e.message || e) + ")";
    return;
  }
  var state = listState(charts);
  if (state.kind === "malformed" || state.kind === "empty") {
    el.textContent = state.message;
    return;
  }
  el.className = "";
  el.textContent = "";
  state.items.forEach(function(item){
    // 유효/무효에 따라 링크/비링크 요소를 생성한다.
    var el1 = document.createElement(item.valid ? "a" : "div");
    el1.className = "chart-item" + (item.valid ? "" : " invalid");
    if (item.valid) {
      el1.href = "./" + encodeURIComponent(item.chart.id) + "/";
    }
    var t = document.createElement("div");
    t.textContent = item.chart.title || (item.valid ? item.chart.id : "(제목 없음)");
    var m = document.createElement("div");
    m.className = "meta";
    if (item.valid) {
      m.textContent = [item.chart.deadline ? "마감 " + item.chart.deadline : "", item.chart.updatedAt ? "갱신 " + item.chart.updatedAt.slice(0,10) : ""]
        .filter(Boolean).join("  ·  ");
    } else {
      m.textContent = "차트 id 가 올바르지 않습니다: ";
      var idSpan = document.createElement("span");
      idSpan.textContent = item.chart.id || "(없음)";
      m.appendChild(idSpan);
    }
    el1.appendChild(t); el1.appendChild(m);
    el.appendChild(el1);
  });
})();
</script>
</body>
</html>
