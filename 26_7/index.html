<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합테스트 보고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet"><style>
:root {
  --bg: #0a0e1a;
  --bg2: #0e1322;
  --panel: #121a2e;
  --line: #26324d;
  --txt: #e6ecf5;
  --muted: #9fb0c8;
  --dim: #697a96;
  --gold: #4ea3ff;
  --gold2: #9cc7ff;
  --amber: #37cdda;
  --hero-bg: linear-gradient(180deg,#0c1120,#0a0e1a);
  --font-display: 'Cinzel', 'Noto Sans KR', sans-serif;
  --font-body: 'Noto Sans KR', sans-serif;
}*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--font-body,'Noto Sans KR',sans-serif);line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--font-display,'Cinzel','Noto Sans KR',serif)}
.topbar{position:sticky;top:0;z-index:50}
nav{background:var(--nav-bg,rgba(12,13,18,.82));backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-weight:900;letter-spacing:.08em;font-size:19px;color:var(--gold2)}
.brand small{display:block;font-weight:400;letter-spacing:.02em;font-size:10px;color:var(--dim);margin-top:-2px}
.navlinks{display:flex;gap:26px;font-size:13.5px;color:var(--muted)}
.navlinks a:hover{color:var(--gold2)}
@media(max-width:860px){.navlinks{display:none}}
.hero{position:relative;padding:90px 0 70px;overflow:hidden;border-bottom:1px solid var(--line);background:var(--hero-bg,linear-gradient(180deg,#0c1120,#0a0e1a))}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.32em;background:var(--eyebrow-bg,transparent);color:var(--eyebrow-ink,var(--gold));text-transform:uppercase;border:1px solid var(--eyebrow-line,var(--line));padding:6px 14px;border-radius:999px}
.hero h1{font-size:clamp(42px,7vw,84px);font-weight:900;letter-spacing:.04em;margin:22px 0 10px;line-height:1;background:var(--h1-grad,linear-gradient(180deg,#fff,var(--gold2) 70%,var(--gold)));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:clamp(15px,2.2vw,20px);color:var(--muted);max-width:620px;white-space:pre-line}
.statusbar{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.chip{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 20px;min-width:135px}
.chip .k{font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.chip .v{font-size:19px;font-weight:700;color:var(--gold2)}
section{padding:74px 0}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
.sec-num{color:var(--gold);font-size:15px;font-weight:700;letter-spacing:.1em}
.sec-head h2{font-size:clamp(26px,3.6vw,38px);font-weight:700}
.sec-sub{color:var(--muted);max-width:760px;margin-bottom:38px;font-size:15.5px}
.tl{position:relative;margin-top:30px;padding-bottom:6px}
.tl-steps{display:flex;justify-content:space-between;position:relative}
.tl-track{position:absolute;left:0;right:0;top:12px;transform:translateY(-50%);height:4px;background:var(--line);border-radius:999px;z-index:0}
.tl-fill{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--amber))}
.tl-step{flex:1;text-align:center;position:relative;z-index:1}
.tl-dotwrap{height:24px;display:flex;align-items:center;justify-content:center}
.tl-step .dot{position:relative;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
.tl-step.is-done .dot{background:var(--gold);border-color:var(--gold)}
.tl-step.is-current .dot{width:20px;height:20px;background:var(--gold);border-color:var(--gold)}
.tl-step.is-current .dot::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:var(--ring,rgba(55,205,218,.22));transform:translate(-50%,-50%) scale(.8);z-index:-1;animation:tl-pulse 2.6s ease-in-out infinite}
@keyframes tl-pulse{0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.65}50%{transform:translate(-50%,-50%) scale(1.4);opacity:.12}}
@media(prefers-reduced-motion:reduce){.tl-step.is-current .dot::after{animation:none;transform:translate(-50%,-50%) scale(1);opacity:.4}}
.tl-label{margin-top:12px;font-weight:700;font-size:14px}
.tl-step.is-current .tl-label{color:var(--txt)}
.tl-period{color:var(--dim);font-size:12px;margin-top:2px}
.bar-pct{color:var(--gold2);font-weight:700}
.bar-track{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--amber))}
.summary-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.scard{flex:1 1 330px;max-width:365px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.scard-title{font-weight:800;font-size:18px;color:var(--txt);margin-bottom:8px}
.scard-sub{font-size:13.5px;color:var(--muted);margin-bottom:18px}
/* 진행바·푸터를 카드 하단에 고정 → sub 길이와 무관하게 같은 줄에서 정렬 */
.scard .bar-track{margin-top:auto}
.scard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}
.scard-foot-label{color:var(--dim)}
.summary-note{margin-top:24px;padding:14px 18px;border-left:3px solid var(--gold);background:var(--panel2,rgba(127,127,127,.06));border-radius:8px;color:var(--muted);font-size:13.5px}
/* 섹션 도움말 한 줄(갤러리 클릭 안내·카드 정렬 안내 등): 콜아웃·불릿이 아닌 작고 옅은 보조 텍스트.
   앞에 ※ 마커(골드 악센트)를 자동으로 붙여 평범한 텍스트와 구분 — 데이터엔 기호를 넣지 않음 */
.sec-hint{font-size:12.5px;color:var(--dim);margin:-2px 0 14px}
.sec-hint::before{content:"※ ";color:var(--gold2);font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-thumb{display:block;position:relative;cursor:zoom-in}
.card-thumb img,.card-thumb video{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
.card-zoom{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:8px;background:rgba(10,10,12,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;opacity:0;transition:opacity .18s ease}
.card-thumb:hover .card-zoom{opacity:1}
.card.is-wide{grid-column:1/-1}
.card.is-wide .card-thumb img,.card.is-wide .card-thumb video{aspect-ratio:auto;max-height:440px;object-fit:contain;background:var(--bg2,#0e1322)}
.card figcaption{padding:12px 14px;font-size:13.5px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:4vh 4vw;background:rgba(8,9,12,.88);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
.lightbox:target{opacity:1;visibility:visible}
.lightbox-inner{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.lightbox-inner video,.lightbox-inner img{position:relative}
/* 공용 확대창의 미디어 자리 — 비어 있을 땐 높이를 차지하지 않는다(원본은 클릭 시 JS가 넣음) */
.lightbox-media{display:block;line-height:0}
body.lb-open{overflow:hidden}
.lightbox img,.lightbox video{display:block;max-width:90vw;max-height:80vh;width:auto;height:auto;object-fit:contain;border-radius:8px}
/* 닫기 버튼: 모바일 탭 타깃을 44px로 키우고 항상 미디어 위(z-index)·터치 동작 보장 */
.lightbox-close{position:absolute;top:8px;left:8px;width:44px;height:44px;padding:0;font-family:inherit;border-radius:10px;background:rgba(10,10,12,.66);border:1px solid rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.lightbox-close:hover,.lightbox-close:active{background:rgba(180,30,40,.85)}
.lightbox-cap{display:block;margin-top:12px;font-size:13.5px;color:var(--muted);max-width:90vw}
.prose{max-width:760px}
.prose p{margin-bottom:14px;color:var(--muted)}
/* 본문(text) 섹션의 불릿은 작은 글씨·옅은 색의 각주성 표기 */
.prose .mlist{font-size:12.5px;color:var(--dim)}
.prose .mlist li{line-height:1.55}
/* 텍스트 필드에서 데이터의 \n 줄바꿈을 렌더 (제목·부제·카드 텍스트 등) */
.hero h1,.sec-head h2,.sec-sub,.ucard-title,.ucard-sub,.scard-title,.card figcaption,.lightbox-cap{white-space:pre-line}
/* 본문(body·note·text·요약 부제)은 fmtBlock이 <p>/<br>/<ul>로 렌더 — 불릿 목록 지원 */
.ucard-body p,.summary-note p,.scard-sub p{margin:0}
.ucard-body p+.mlist,.ucard-body .mlist+p,.summary-note p+.mlist,.scard-sub p+.mlist{margin-top:10px}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{position:relative;padding-left:18px;line-height:1.6}
.mlist li+li{margin-top:8px}
.mlist li::before{content:"";position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
/* 인라인 표기: `코드` 와 [링크](http…) (본문 링크는 target=_blank로 nav 링크와 구분) */
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;background:rgba(127,127,127,.14);padding:1px 6px;border-radius:5px}
a[target="_blank"]{color:var(--gold2);text-decoration:underline;text-underline-offset:2px}
/* 인라인 **굵게**는 강조색(기본 --amber, ORV=오렌지)으로. --strong으로 재정의 가능 */
strong{color:var(--strong,var(--amber))}
/* 분류 그룹 컨테이너: 항상 전체 폭 유지. 열 수(--cap-cols)는 카드 폭으로만 반영 → 4개=2+2(넓은 카드)·8개=3+3+2 */
.cgroup{margin:26px auto 0}
.cgroup-first{margin-top:6px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
/* 카드 분류 서브헤더: 그룹 컨테이너 폭만큼 밑줄을 깔아 그룹을 구분 */
.cards-group-head{margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);font-size:18px;font-weight:800;letter-spacing:.01em;color:var(--gold2)}
/* 카드 폭 = (그룹 전체 폭 − 간격) ÷ 열 수. grow:0이라 채운 행은 꽉 차고, 마지막 부분 행은 같은 폭으로 가운데 정렬.
   모바일 등 좁은 폭에선 max()의 280px 하한이 적용돼 열 수가 자동으로 줄어듦(반응형). */
.ucard{flex:0 1 max(280px, calc((100% - (var(--cap-cols,3) - 1) * 18px) / var(--cap-cols,3)));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 22px 24px}
.ucard.is-dark{background:var(--card-dark-bg,#1a1a1a);border-color:var(--card-dark-bg,#1a1a1a)}
.ucard.is-soft{background:var(--card-soft-bg,#e8e4d6);border-color:var(--card-soft-bg,#e8e4d6)}
.ucard-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.ucard-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 11px;border-radius:999px;background:var(--gold);color:#1b1b1b}
.ucard-badge.b-orange{background:var(--amber);color:#fff}
.ucard-badge.b-dark{background:#1f1f1f;color:#f4f5f3}
/* 작업유형별 배지 색 (테마에서 --badge-* 로 덮어쓰기 가능) */
.ucard-badge.b-sys{background:var(--badge-sys,var(--gold));color:#1b1b1b}
.ucard-badge.b-char{background:var(--badge-char,#f0883e);color:#fff}
.ucard-badge.b-mon{background:var(--badge-mon,#d2553f);color:#fff}
.ucard-badge.b-play{background:var(--badge-play,#2f8fb0);color:#fff}
.ucard-badge.b-cut{background:var(--badge-cut,#8b6db0);color:#fff}
.ucard-status{font-size:11.5px;font-weight:700;white-space:nowrap}
.ucard-status.t-hi{color:var(--gold2)}
.ucard-status.t-mid{color:var(--txt)}
.ucard-status.t-lo{color:var(--muted)}
.ucard-status.t-zero{color:var(--dim)}
.ucard.is-dark .ucard-status.t-mid{color:var(--card-dark-ink,#f4f5f3)}
/* 종합 진행률 강조 블록 (현재 수치 + 변화율) — 섹션과 균형 맞춘 컴팩트 밴드 */
.sec-overall{background:var(--panel2,rgba(127,127,127,.05));border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:14px 20px;margin-bottom:26px}
.sec-overall-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-overall-label{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.sec-overall-caption{font-size:11.5px;color:var(--dim)}
.sec-overall-figures{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.sec-overall-pct{font-family:var(--font-display,'Cinzel',serif);font-size:clamp(30px,4.4vw,40px);font-weight:900;line-height:1;color:var(--gold2)}
.sec-overall-unit{font-size:.5em;font-weight:800;margin-left:2px}
.sec-overall-delta{display:inline-flex;align-items:baseline;gap:7px;padding:4px 11px;border-radius:999px}
.sec-overall-delta-num{font-size:14px;font-weight:900;white-space:nowrap;letter-spacing:.01em}
.sec-overall-delta-cap{font-size:11px;font-weight:700;letter-spacing:.02em;opacity:.8}
.sec-overall-delta.d-up{color:#3f8b52;background:rgba(76,154,91,.13)}
.sec-overall-delta.d-dn{color:#c05339;background:rgba(200,92,72,.13)}
.sec-overall-delta.d-flat{color:var(--muted);background:rgba(127,127,127,.12)}
.sec-overall-bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.sec-overall-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--amber))}
.sec-overall-note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.55;color:var(--muted)}
.sec-overall-note::before{content:"ⓘ ";color:var(--gold2);font-weight:800}
/* 진행바를 카드 하단에 고정 → 본문 길이와 무관하게 같은 행에서 정렬(§02 카드와 동일) */
.ucard-prog{margin-top:auto;padding-top:18px}
.ucard-prog .bar-track{height:7px}
.ucard-prog-foot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}
.ucard-prog-pct{font-size:12.5px;font-weight:700;color:var(--gold2)}
/* 지난 집계 대비 변화량 칩 (▲증가·▼감소·▬변동없음) */
.ucard-delta{font-size:11.5px;font-weight:800;white-space:nowrap;letter-spacing:.01em}
.ucard-delta.d-up{color:var(--delta-up,#4c9a5b)}
.ucard-delta.d-dn{color:var(--delta-dn,#c85c48)}
.ucard-delta.d-flat{color:var(--dim)}
.ucard-delta.d-new{color:var(--gold2);font-weight:800}
.ucard.is-dark .ucard-delta.d-new{color:var(--gold2)}
.ucard.is-dark .ucard-delta.d-up{color:#7fce8c}
.ucard.is-dark .ucard-delta.d-dn{color:#e08a76}
.ucard.is-dark .ucard-delta.d-flat{color:var(--card-dark-ink,#c4c6c1)}
.ucard-sub{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:8px}
.ucard-title{font-weight:800;font-size:16.5px;line-height:1.4;margin-bottom:10px;color:var(--txt)}
.ucard-body{font-size:13.5px;line-height:1.65;color:var(--muted)}
.ucard.is-dark .ucard-title{color:var(--card-dark-ink,#f4f5f3)}
.ucard.is-dark .ucard-body{color:#c4c6c1}
.ucard.is-dark .ucard-sub{color:#9a9c97}
.ucard.is-soft .ucard-title{color:#1b1b1b}
.ucard.is-soft .ucard-body{color:#5e5b50}
.ucard.is-soft .ucard-sub{color:#86826f}
footer{border-top:1px solid var(--line);padding:40px 0;color:var(--dim);font-size:13px}
.foot-copy{margin-top:8px;font-size:11.5px;color:var(--dim);line-height:1.65;opacity:.85}

/* ===== 보안 표시 (테마 무관 고정 적색 팔레트 + 테마 변수 혼용) ===== */
/* 상단 보안 배너 (편집 가능: report.json security.banner) */
.secbar{background:linear-gradient(90deg,#7a1019,#a51626 50%,#7a1019);color:#fff;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.03em;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.35);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.secbar .wrap{display:block;line-height:1.5}
.secbar strong{color:#fde68a}
/* 하단 보안/접속 정보 블록 */
.secfoot{padding:0;background:linear-gradient(180deg,rgba(165,22,38,.07),transparent 70%)}
.secfoot::before,.secfoot::after{content:"";display:block;height:13px;background:repeating-linear-gradient(45deg,#a51626 0,#a51626 13px,#1a0c0f 13px,#1a0c0f 26px);opacity:.92}
.secfoot-grid{display:grid;grid-template-columns:auto 1fr minmax(290px,360px);gap:32px;align-items:center;padding:32px 24px}
.secstamp{display:flex;align-items:center;justify-content:center}
.secstamp span{display:inline-block;font-family:var(--font-display,'Cinzel',serif);font-weight:700;font-size:22px;letter-spacing:.18em;color:#e0555f;border:3px double #c0303a;border-radius:8px;padding:14px 22px;transform:rotate(-6deg);text-shadow:0 0 14px rgba(224,85,95,.45);box-shadow:0 0 0 1px rgba(192,48,58,.25),0 0 26px rgba(165,22,38,.18) inset;white-space:nowrap}
.secnotice{font-size:13px;line-height:1.75;color:var(--muted)}
.secnotice strong{color:var(--strong,var(--amber))}
.access{border:1px solid var(--line);border-radius:14px;padding:16px 20px;background:var(--panel)}
.access-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--gold2);margin-bottom:10px}
.access-dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.55);animation:acc-pulse 2.4s ease-out infinite}
@keyframes acc-pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.5)}70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
@media(prefers-reduced-motion:reduce){.access-dot{animation:none}}
.access-line{font-size:13px;color:var(--muted);line-height:1.9}

<script>window.__ORV_SAVE__ = "";</script>
<script>// 인라인 텍스트 포맷터: HTML은 이스케이프(XSS 안전)하고 마크다운식 인라인 표기만 변환한다.
//   **굵게**      → <strong>
//   *기울임*       → <em>
//   ~~취소선~~     → <s>
//   `코드`         → <code>  (내부 특수문자는 다른 표기로 변환되지 않게 보호)
//   [텍스트](http…) → <a>     (http/https URL만 허용)
// 줄바꿈(\n)은 CSS white-space:pre-line이 렌더하므로 여기서 건드리지 않는다.
// 템플릿에서 <%~ it._fmt(text) %> (raw 출력)로 사용한다.

const SENT = ""; // 코드 보호용 sentinel (이스케이프된 일반 텍스트엔 등장하지 않는 제어문자)

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function fmt(s) {
  let t = escapeHtml(s);

  // 1) 인라인 코드: 내용을 잠시 빼두어 ** * ~~ 변환의 영향을 받지 않게 보호
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return SENT + (codes.length - 1) + SENT;
  });

  // 2) 링크 [텍스트](http(s)://...) — URL은 http/https만 허용
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  // 3) 굵게 → 취소선 → 기울임 (굵게를 먼저 처리해야 ** 가 * 로 오인되지 않음)
  t = t.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/~~([^~]+?)~~/g, "<s>$1</s>");
  t = t.replace(/\*([^*\n]+?)\*/g, "<em>$1</em>");

  // 4) 코드 복원
  t = t.replace(new RegExp(SENT + "(\\d+)" + SENT, "g"), (_, i) => `<code>${codes[+i]}</code>`);
  return t;
}

// 본문용 블록 포맷터: 줄 단위로 처리한다.
//   "- " 또는 "• " 로 시작하는 줄  → 불릿 목록(<ul class="mlist"><li>…)
//   빈 줄                          → 블록(문단/목록) 구분
//   그 외 줄                       → 문단(<p>), 같은 문단 내 줄바꿈은 <br>
// 각 줄의 인라인 표기(**굵게** 등)는 fmt로 처리한다.
function fmtBlock(s) {
  const lines = String(s == null ? "" : s).split("\n");
  const out = [];
  let buf = [];
  let mode = null; // 'list' | 'text'
  const flush = () => {
    if (!buf.length) return;
    if (mode === "list") out.push('<ul class="mlist">' + buf.map((x) => "<li>" + fmt(x) + "</li>").join("") + "</ul>");
    else out.push("<p>" + buf.map((x) => fmt(x)).join("<br>") + "</p>");
    buf = [];
  };
  for (const ln of lines) {
    if (ln.trim() === "") { flush(); mode = null; continue; }
    const m = ln.match(/^\s*[-•]\s+(.*)$/);
    if (m) {
      if (mode !== "list") { flush(); mode = "list"; }
      buf.push(m[1]);
    } else {
      if (mode !== "text") { flush(); mode = "text"; }
      buf.push(ln);
    }
  }
  flush();
  return out.join("");
}

;window.__ORV_FMT = { fmt: fmt, fmtBlock: fmtBlock };</script>
<script>
/* 호스팅 페이지 편집 모드 — 주소에 ?edit=1 을 붙이면 활성화(일반 방문자는 영향 없음).
   data-edit 텍스트를 그 자리에서 수정하고, data-node 블록을 삭제한 뒤, 변경분만 원본 report.json에 적용해 내려받는다.
   Firebase 등 백엔드/인증 없이 데이터-파일 모델을 유지(진실의 원천은 report.json). 자세한 근거는 docs 참고. */
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get("edit") !== "1") return;

  var srcEl = document.getElementById("report-src");
  var ORIGINAL = srcEl ? JSON.parse(srcEl.textContent) : {};
  var changed = {};        // path -> 새 텍스트 (사용자가 실제로 고친 것만)
  var deleted = [];        // 삭제 표시된 data-node 경로들

  // ---- JSON 경로 헬퍼 ("sections.0.cards.2.caption") ----
  function getPath(obj, path) {
    return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, obj);
  }
  function setPath(obj, path, val) {
    var keys = path.split("."), o = obj;
    for (var i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    if (o) o[keys[keys.length - 1]] = val;
  }
  function delPath(obj, path) {
    var keys = path.split("."), o = obj;
    for (var i = 0; i < keys.length - 1; i++) { if (o == null) return; o = o[keys[i]]; }
    var last = keys[keys.length - 1];
    if (Array.isArray(o)) o.splice(Number(last), 1);
    else if (o) delete o[last];
  }

  function buildExport() {
    var out = JSON.parse(JSON.stringify(ORIGINAL));   // 원본 복제
    Object.keys(changed).forEach(function (path) { setPath(out, path, changed[path]); });
    // 배열 인덱스 꼬임 방지: 깊은/큰 인덱스부터 삭제
    deleted.slice().sort(function (a, b) {
      var an = a.split("."), bn = b.split(".");
      if (an.length !== bn.length) return bn.length - an.length;
      return b.localeCompare(a, undefined, { numeric: true });
    }).forEach(function (path) { delPath(out, path); });
    return JSON.stringify(out, null, 2);
  }

  // ---- 편집 가능 텍스트 ----
  //   ★ 렌더된 HTML이 아니라 "마크다운 원본"을 편집한다. 렌더 HTML(<ul>/<strong>/<a>)을 innerText로
  //     캡처하면 - · ** · * · [링크] 가 사라지므로, 진입 시 각 필드를 원본 문자열로 되돌려(textContent)
  //     그 자리에서 마크다운을 고치게 한다. 저장 시 buildHtml이 다시 렌더된 HTML로 복원한다.
  document.querySelectorAll("[data-edit]").forEach(function (el) {
    var src = getPath(ORIGINAL, el.getAttribute("data-edit"));
    if (src != null) el.textContent = String(src);
    el.setAttribute("contenteditable", "true");
    el.classList.add("edit-target");
    el.addEventListener("input", function () {
      changed[el.getAttribute("data-edit")] = el.innerText.replace(/ /g, " ").trim();
    });
  });

  // ---- 삭제 가능 블록 ----
  document.querySelectorAll("[data-node]").forEach(function (el) {
    el.classList.add("edit-node");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "edit-del";
    btn.textContent = "✕ 삭제";
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var path = el.getAttribute("data-node");
      if (el.classList.contains("is-deleted")) {
        el.classList.remove("is-deleted");
        deleted = deleted.filter(function (p) { return p !== path; });
        btn.textContent = "✕ 삭제";
      } else {
        el.classList.add("is-deleted");
        if (deleted.indexOf(path) < 0) deleted.push(path);
        btn.textContent = "↺ 되돌리기";
      }
    });
    el.appendChild(btn);
  });

  // ---- 현재 편집 상태를 그대로 반영한 정적 index.html 생성(WYSIWYG) ----
  //   편집 UI 제거 + 삭제 표시 블록 실제 제거 + contenteditable 해제 → 배포 가능한 깔끔한 HTML.
  function buildHtml() {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll(".edit-bar, .edit-del").forEach(function (e) { e.remove(); });
    // 실행 중 상태(지연로딩으로 붙은 영상 src·열려 있던 확대창)가 저장본에 구워지지 않게 되돌린다.
    //   이 저장본은 그대로 배포되므로, 여기서 정리하지 않으면 다음 배포부터 지연로딩이 무력화된다.
    clone.querySelectorAll(".card-thumb video[data-src]").forEach(function (v) { v.removeAttribute("src"); });
    clone.querySelectorAll(".lightbox").forEach(function (box) {
      var m = box.querySelector(".lightbox-media");
      if (m) m.innerHTML = "";
      var c = box.querySelector(".lightbox-cap");
      if (c) c.innerHTML = "";
      box.setAttribute("aria-hidden", "true");
    });
    clone.querySelectorAll(".is-deleted").forEach(function (e) { e.remove(); });   // 삭제 확정 적용
    // 편집 중엔 필드에 마크다운 원본이 들어있다 → 배포 HTML은 다시 렌더된 형태로 복원(불릿·굵게·링크 유지).
    var F = window.__ORV_FMT || { fmt: function (s) { return s; }, fmtBlock: function (s) { return s; } };
    clone.querySelectorAll("[data-edit]").forEach(function (e) {
      var path = e.getAttribute("data-edit");
      var md = (path in changed) ? changed[path] : getPath(ORIGINAL, path);
      if (md == null) md = "";
      e.innerHTML = (e.getAttribute("data-fmt") === "block") ? F.fmtBlock(md) : F.fmt(md);
    });
    clone.querySelectorAll("[contenteditable]").forEach(function (e) { e.removeAttribute("contenteditable"); });
    clone.querySelectorAll(".edit-target, .edit-node").forEach(function (e) {
      e.classList.remove("edit-target", "edit-node");
    });
    if (clone.querySelector("body")) clone.querySelector("body").classList.remove("edit-on", "lb-open");
    // 임베드 원본 JSON(report-src)도 편집·삭제분을 반영해 갱신 → 저장된 페이지를 다시 ?edit=1로 열어도 최신 상태에서 시작.
    //   (닫는 script 태그 시퀀스만 이스케이프 — render.js와 동일 규칙. 주석에도 그 시퀀스를 literal로 쓰면 인라인 스크립트가 조기 종료되므로 주의)
    var srcOut = clone.querySelector("#report-src");
    if (srcOut) srcOut.textContent = buildExport().replace(/<\/(script)/gi, "<\\/$1");
    return "<!DOCTYPE html>\n" + clone.outerHTML;
  }

  // ---- 중계 서버(Cloudflare Worker)로 저장 → git 커밋 → 자동 배포 ----
  //   토큰은 페이지에 없음. 검수자는 저장할 때마다 공용 비밀번호를 입력(브라우저에 저장하지 않음).
  function saveToSite(btn) {
    var ep = window.__ORV_SAVE__;
    if (!ep) { alert("저장 서버가 설정되지 않았습니다(report.json의 edit.saveEndpoint)."); return; }
    // 매 저장마다 비밀번호 입력(저장 안 함 — 공용 PC에 남지 않도록)
    var pw = prompt("편집 비밀번호를 입력하세요");
    if (!pw) return;
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = "저장 중…";
    fetch(ep, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw, content: buildHtml() })
    }).then(function (res) {
      if (res.status === 401) {
        throw new Error("비밀번호가 틀렸습니다. 다시 시도하세요.");
      }
      if (!res.ok) throw new Error("서버 오류 (HTTP " + res.status + ")");
      alert("저장됐습니다. 약 1~2분 후 사이트에 반영됩니다.");
      location.replace(location.pathname);   // ?edit=1 제거 → 기본 주소로 이동(편집 모드 종료)
      return;
    }).catch(function (e) {
      alert("저장 실패: " + e.message);
    }).then(function () {
      btn.disabled = false; btn.textContent = label;
    });
  }

  // ---- 편집 툴바 ----
  var hasSave = !!window.__ORV_SAVE__;
  var bar = document.createElement("div");
  bar.className = "edit-bar";
  bar.innerHTML =
    '<span class="edit-bar-tag">편집 모드</span>' +
    '<span class="edit-bar-hint">텍스트를 클릭해 수정 · 블록의 ✕ 삭제로 제거</span>' +
    (hasSave ? '<button type="button" id="edit-save">사이트에 저장</button>' : '') +
    '<button type="button" id="edit-export"' + (hasSave ? ' class="ghost"' : '') + '>report.json 내려받기</button>' +
    '<button type="button" id="edit-reset" class="ghost">처음으로</button>';
  document.body.appendChild(bar);
  document.body.classList.add("edit-on");

  if (hasSave) {
    document.getElementById("edit-save").addEventListener("click", function () { saveToSite(this); });
  }
  document.getElementById("edit-export").addEventListener("click", function () {
    var blob = new Blob([buildExport()], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "report.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById("edit-reset").addEventListener("click", function () {
    if (confirm("수정·삭제한 내용을 모두 취소하고 원래대로 되돌릴까요?")) location.reload();
  });
})();
</script>
