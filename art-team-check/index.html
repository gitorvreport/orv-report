<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아트팀 최적화 작업체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 요약 막대와 필터를 위에 두고, 항목 카드를 한 열로 쌓는다. 카드는 개요와 작업 사항을 두 칸으로 나란히 보여 준다. */
:root{
  --bg:#f3f5f8;--surface:#ffffff;--detail:#f1f3f7;--todo:#0b6b5f;--todo-soft:#e3f3ef;--ink:#17202e;--muted:#5a6679;--line:#dde2ea;--accent:#2450d6;--accent-soft:#e8eefc;
  --cpu:#8a4b00;--cpu-soft:#fdf0dc;--gpu:#5b3fc4;--gpu-soft:#eeeafc;--ok:#17703a;--warn:#a42828;--warn-soft:#fbe7e7;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c;--surface:#171e29;--detail:#0e141d;--todo:#6fdcc4;--todo-soft:#123029;--ink:#e6eaf2;--muted:#9aa6ba;--line:#2a3445;--accent:#8fb0ff;--accent-soft:#1c2a4a;
  --cpu:#f2b765;--cpu-soft:#3a2a10;--gpu:#b9a8ff;--gpu-soft:#2a2350;--ok:#5fd68a;--warn:#ff9c9c;--warn-soft:#3c1b1b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c;--surface:#171e29;--detail:#0e141d;--todo:#6fdcc4;--todo-soft:#123029;--ink:#e6eaf2;--muted:#9aa6ba;--line:#2a3445;--accent:#8fb0ff;--accent-soft:#1c2a4a;
  --cpu:#f2b765;--cpu-soft:#3a2a10;--gpu:#b9a8ff;--gpu-soft:#2a2350;--ok:#5fd68a;--warn:#ff9c9c;--warn-soft:#3c1b1b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);word-break:keep-all}
.wrap{max-width:960px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;margin:0 0 24px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:16px}
.prog{flex:1 1 220px;min-width:200px}
.prog-t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width 150ms ease-out}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button,.act{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:0;border-radius:7px;padding:6px 12px;min-height:36px;cursor:pointer;transition:background-color 150ms ease-out,color 150ms ease-out}
.seg button:hover,.act:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.act{border:1px solid var(--line);background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card[hidden]{display:none}
.card-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:start}
.check{display:flex;justify-content:center;padding-top:16px;min-height:44px}
.check input{width:20px;height:20px;margin:0;accent-color:var(--ok);cursor:pointer}
.main{padding:14px 0 16px 4px;cursor:pointer;user-select:text;-webkit-user-select:text;min-width:0}
.main *{user-select:text;-webkit-user-select:text}
.toggle{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-top:6px;cursor:pointer;border-radius:10px}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.t-row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.title{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.45;text-wrap:balance}
.card.done .title{color:var(--muted);text-decoration:line-through}
.chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform 150ms ease-out}
.card.open .chev{transform:rotate(90deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;font-size:12px;line-height:1.5;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.cpu{background:var(--cpu-soft);color:var(--cpu);border-color:transparent;font-weight:500}
.chip.gpu{background:var(--gpu-soft);color:var(--gpu);border-color:transparent;font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
.col{border-radius:8px;padding:10px 14px 12px;font-size:14px;line-height:1.65}
.lb{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.col.ov{background:var(--bg);border:1px solid var(--line)}
.col.td{background:var(--todo-soft);border:1px solid color-mix(in srgb,var(--todo) 28%,transparent)}
.col.td .lb{color:var(--todo)}
.detail{user-select:text;-webkit-user-select:text;display:none;background:var(--detail);border-top:1px solid var(--line);padding:4px 18px 20px 48px}
.card.open .detail{display:block}
@media(max-width:640px){.detail{padding-left:18px}}
.detail h3{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 6px}
.detail p{margin:12px 0 0}
.detail ul{margin:0;padding-left:20px}
.detail li{margin:4px 0}
.callout{margin-top:16px;padding:12px 16px 14px;border-radius:10px;background:var(--todo-soft);border:1px solid color-mix(in srgb,var(--todo) 30%,transparent)}
.callout h3{margin:0 0 6px;color:var(--todo);font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:36px;transition:border-color 150ms ease-out}
.links a:hover{border-color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap}
td{background:var(--surface)}
th{background:color-mix(in srgb,var(--muted) 16%,var(--surface));font-weight:600}
code{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);padding:0 5px;border-radius:4px;word-break:break-all}
.foot{color:var(--muted);font-size:12px;margin-top:24px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>아트팀 최적화 작업체크</h1>
  <p class="meta">원본 <a href="https://offbeatplay.atlassian.net/wiki/spaces/OFFBEAT/pages/714768421/2026.B2." target="_blank" rel="noopener">2026.B2.최적화 일감</a> v13 (2026-11-26). 프로그램, 엔진, TA 항목은 제외했습니다.</p>
  <div class="toolbar">
    <div class="prog"><div class="prog-t"><span>완료</span><span id="pcount"></span></div><div class="track"><div class="fill" id="pfill"></div></div></div>
    <div class="seg" role="group" aria-label="필터">
      <button type="button" data-f="all" aria-pressed="true">전체</button>
      <button type="button" data-f="CPU" aria-pressed="false">CPU</button>
      <button type="button" data-f="GPU" aria-pressed="false">GPU</button>
      <button type="button" data-f="todo" aria-pressed="false">미완료</button>
    </div>
    <button type="button" class="act" id="expand">모두 펼치기</button>
    <button type="button" class="act" id="collapse">모두 접기</button>
  </div>
  <div id="list"></div>
  <p class="foot">체크 상태는 이 브라우저에만 저장됩니다. 이미지와 캡처는 문서 링크에서 확인하십시오.</p>
</div>

const KEY="artcheck-b2-v1";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const list=document.getElementById("list");
const CH='<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>';
const cards={};
let filter="all";
ITEMS.forEach(it=>{
  const el=document.createElement("article");
  el.className="card";el.id=it.id;cards[it.id]=el;
  const w=it.sections.find(s=>s[0]==="작업 사항");
  let d=`<p>${it.summary}</p>`;
  if(w)d+=`<div class="callout"><h3>작업 사항</h3><ul>${w[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  d+=`<h3>문서 링크</h3><div class="links">${it.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join("")}</div>`;
  it.sections.forEach(s=>{if(s[0]==="작업 사항")return;d+=`<h3>${s[0]}</h3><ul>${s[1].map(x=>`<li>${x}</li>`).join("")}</ul>`});
  if(it.table)d+=`<h3>${it.table.cap}</h3><div class="tw"><table><tr>${it.table.head.map(h=>`<th>${h}</th>`).join("")}</tr>${it.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
  el.innerHTML=`<div class="card-head"><label class="check"><input type="checkbox" id="cb-${it.id}" aria-label="${it.title} 완료"></label><div class="main"><div class="t-row"><span class="title">${it.title}</span></div><span class="chips"><span class="chip ${it.cat.toLowerCase()}">${it.cat}</span><span class="chip">${it.team}</span>${it.warn?`<span class="chip warn">${it.warn}</span>`:""}</span><span class="cols"><span class="col ov"><span class="lb">부하 개요</span>${it.overview}</span><span class="col td"><span class="lb">작업 사항</span>${it.todo}</span></span></div><button type="button" class="toggle" aria-expanded="false" aria-controls="d-${it.id}" aria-label="${it.title} 상세 보기">${CH}</button></div><div class="detail" id="d-${it.id}">${d}</div>`;
  const cb=el.querySelector("input"),tg=el.querySelector(".toggle");
  cb.checked=!!state[it.id];el.classList.toggle("done",cb.checked);
  cb.addEventListener("change",()=>{state[it.id]=cb.checked;el.classList.toggle("done",cb.checked);save();upd()});
  const flip=()=>{const o=el.classList.toggle("open");tg.setAttribute("aria-expanded",o)};
  tg.addEventListener("click",flip);
  el.querySelector(".main").addEventListener("click",e=>{if(e.target.closest("a"))return;const s=window.getSelection();if(s&&s.toString().length)return;flip()});
  list.appendChild(el);
});
function setOpen(o){document.querySelectorAll(".card").forEach(c=>{c.classList.toggle("open",o);c.querySelector(".toggle").setAttribute("aria-expanded",o)})}
function upd(){
  const n=ITEMS.filter(i=>state[i.id]).length;
  document.getElementById("pcount").textContent=n+" / "+ITEMS.length;
  document.getElementById("pfill").style.width=(n/ITEMS.length*100)+"%";
  ITEMS.forEach(i=>{cards[i.id].hidden=!(filter==="all"||(filter==="todo"?!state[i.id]:i.cat===filter))});
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.f;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));upd()}));
document.getElementById("expand").onclick=()=>setOpen(true);
document.getElementById("collapse").onclick=()=>setOpen(false);
upd();
</script>
</body>
